# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: false
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        java: [11, 17, 21]
        maven: ['3.9.16']
        jdk: ['temurin']
        # the oldest supported Maven (see <prerequisites> in pom.xml) on the oldest tested Java
        include:
          - { os: ubuntu-latest, java: 11, maven: '3.6.3', jdk: temurin }
          - { os: windows-latest, java: 11, maven: '3.6.3', jdk: temurin }
          - { os: macOS-latest, java: 11, maven: '3.6.3', jdk: temurin }
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.jdk }}
          java-version: ${{ matrix.java }}
          cache: 'maven'
      # quoted so that PowerShell on Windows doesn't split the property at the dots
      - name: Use Maven ${{ matrix.maven }}
        run: ./mvnw -B -N -q org.apache.maven.plugins:maven-wrapper-plugin:3.3.4:wrapper "-Dmaven=${{ matrix.maven }}" "-Dtype=only-script"
      - name: Build with Maven
        run: ./mvnw -T 1C -B verify -P its

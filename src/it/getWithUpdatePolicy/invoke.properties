# The cache holds an outdated copy of the URL, see prepare.groovy.

# 1. default updatePolicy (never): the cached copy is used without asking the server
invoker.goals.1 = ${project.groupId}:${project.artifactId}:${project.version}:wget
invoker.buildResult.1 = success
invoker.mavenOpts.1 = \
  -Ddownload.url=${mrm.repository.url}/localhost/dummy-api/1.0/dummy-api-1.0.jar \
  -Ddownload.cache.directory=cache \
  -Ddownload.outputFileName=never.jar

# 2. always: the server sends the current version, which replaces the cached copy
invoker.goals.2 = ${project.groupId}:${project.artifactId}:${project.version}:wget
invoker.buildResult.2 = success
invoker.mavenOpts.2 = \
  -Ddownload.url=${mrm.repository.url}/localhost/dummy-api/1.0/dummy-api-1.0.jar \
  -Ddownload.cache.directory=cache \
  -Ddownload.cache.updatePolicy=always \
  -Ddownload.outputFileName=always.jar

# 3. always, again: the cached copy is current now
invoker.goals.3 = ${project.groupId}:${project.artifactId}:${project.version}:wget
invoker.buildResult.3 = success
invoker.mavenOpts.3 = \
  -Ddownload.url=${mrm.repository.url}/localhost/dummy-api/1.0/dummy-api-1.0.jar \
  -Ddownload.cache.directory=cache \
  -Ddownload.cache.updatePolicy=always \
  -Ddownload.outputFileName=again.jar

# 4. always, offline: the server is not asked, the cached copy is used
invoker.goals.4 = ${project.groupId}:${project.artifactId}:${project.version}:wget
invoker.offline.4 = true
invoker.buildResult.4 = success
invoker.mavenOpts.4 = \
  -Ddownload.url=${mrm.repository.url}/localhost/dummy-api/1.0/dummy-api-1.0.jar \
  -Ddownload.cache.directory=cache \
  -Ddownload.cache.updatePolicy=always \
  -Ddownload.outputFileName=offline.jar

# 1. online: download and populate a project-local cache
invoker.goals.1 = ${project.groupId}:${project.artifactId}:${project.version}:wget
invoker.buildResult.1 = success
invoker.mavenOpts.1 = \
  -Ddownload.url=${mrm.repository.url}/localhost/dummy-api/1.0/dummy-api-1.0.jar \
  -Ddownload.cache.directory=cache \
  -Ddownload.outputFileName=online.jar

# 2. offline: same URL is served from the cache
invoker.goals.2 = ${project.groupId}:${project.artifactId}:${project.version}:wget
invoker.offline.2 = true
invoker.buildResult.2 = success
invoker.mavenOpts.2 = \
  -Ddownload.url=${mrm.repository.url}/localhost/dummy-api/1.0/dummy-api-1.0.jar \
  -Ddownload.cache.directory=cache \
  -Ddownload.outputFileName=offline.jar

# 3. offline: a URL that isn't cached fails the build
invoker.goals.3 = ${project.groupId}:${project.artifactId}:${project.version}:wget
invoker.offline.3 = true
invoker.buildResult.3 = failure
invoker.mavenOpts.3 = \
  -Ddownload.url=${mrm.repository.url}/localhost/dummy-impl/1.0/dummy-impl-1.0.jar \
  -Ddownload.cache.directory=cache \
  -Ddownload.outputFileName=missing.jar
